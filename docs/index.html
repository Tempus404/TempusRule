const CLIENTS = Object.keys(DATA);
let cur = CLIENTS[0];
const tabsEl = document.getElementById('tabs');
const listEl = document.getElementById('list');
const qEl = document.getElementById('q');
CLIENTS.forEach(c => {
  const b = document.createElement('button');
  b.textContent = c;
  b.onclick = () => { cur = c; qEl.value = ''; render(); };
  tabsEl.appendChild(b);
});
function render() {
  [...tabsEl.children].forEach((b, i) => b.classList.toggle('on', CLIENTS[i] === cur));
  const q = qEl.value.trim().toLowerCase();
  const items = DATA[cur].filter(it => !q || it.label.toLowerCase().includes(q) || it.file.toLowerCase().includes(q));
  listEl.innerHTML = '';
  if (!items.length) { listEl.innerHTML = '<div class="empty">没找到</div>'; return; }
  items.forEach(it => {
    const row = document.createElement('div');
    row.className = 'row';
    const meta = it.count === null ? '配置' : it.count.toLocaleString('en-US') + ' 条规则';
    row.innerHTML = '<div class="info"><div class="name"></div><div class="meta"><span class="cnt"></span> · <span class="url"></span></div></div>';
    row.querySelector('.name').textContent = it.label;
    row.querySelector('.cnt').textContent = meta;
    row.querySelector('.url').textContent = it.file;
    const btn = document.createElement('button');
    btn.className = 'copy'; btn.textContent = '复制链接';
    btn.onclick = async () => {
      try { await navigator.clipboard.writeText(it.url); }
      catch (e) {
        const ta = document.createElement('textarea');
        ta.value = it.url; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
      }
      btn.textContent = '已复制'; btn.classList.add('done');
      setTimeout(() => { btn.textContent = '复制链接'; btn.classList.remove('done'); }, 1500);
    };
    row.appendChild(btn);
    listEl.appendChild(row);
  });
}
qEl.oninput = render;
render();
